# skilly Helm chart values. See deploy/helm/skilly/templates/NOTES.txt for post-install steps.
nameOverride: ""
fullnameOverride: ""

image:
  web:
    repository: skilly/web
    tag: ""            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  worker:
    repository: skilly/worker
    tag: ""
    pullPolicy: IfNotPresent
imagePullSecrets: []

# External HTTPS URL (OIDC redirect + install-command generation). Must match the Ingress host.
publicBaseUrl: "https://skilly.example.com"

# ── Web (stateless; scale horizontally) ────────────────────────────────────
web:
  replicas: 2
  resources: {}
  # Express-style `trust proxy` for web (TRUST_PROXY): the number of proxies in front of web, so
  # the OAuth dynamic-client-registration per-IP rate limit (§49.9) keys on the real client.
  # "" = don't trust X-Forwarded-For (every DCR caller shares the ingress controller's bucket).
  trustProxy: ""
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75

# ── Worker (leader-locked via Postgres advisory lock; replicas >1 are safe) ─
worker:
  replicas: 1
  resources: {}
  # Express `trust proxy` (TRUST_PROXY): the number of proxies in front of the worker, so install
  # IPs and every per-IP rate limit see the real client (§9/§22). "" = don't trust X-Forwarded-For
  # (all clients then share the ingress controller's single rate-limit bucket).
  trustProxy: ""
  # §22 per-surface rate limits, per worker instance. Empty = the built-in default (in brackets).
  # /healthz /readyz /metrics are never limited, so probes are unaffected.
  rateLimits:
    gitIpMax: ""          # [600] git requests per IP per window, before auth
    gitIpWindowMs: ""     # [60000]
    gitTokenMax: ""       # [300] git requests per installation per window, after auth
    gitTokenWindowMs: ""  # [900000]
    scimMax: ""           # [600] SCIM requests per IP per window
    scimWindowMs: ""      # [60000]
  gitStorage:
    size: 10Gi
    storageClass: ""

# ── Ingress (terminate TLS here or at an upstream LB) ───────────────────────
ingress:
  enabled: true
  className: ""
  annotations: {}
  host: skilly.example.com
  tls:
    enabled: true
    secretName: skilly-tls

# ── Secrets ─────────────────────────────────────────────────────────────────
# In production set secrets.existingSecret to a Secret you manage (keys below). Otherwise
# the chart renders a Secret from these values (fine for evaluation, not for prod).
secrets:
  existingSecret: ""
  nextauthSecret: "change-me-generate-with-openssl-rand-base64-32"
  scimBearerToken: "change-me-long-random"
  entraClientSecret: ""
  appDbPassword: "change-me-app"
  postgresPassword: "change-me-owner"
  metricsToken: ""
  smtpPassword: ""
  # §12 Graph email service account: encrypts the stored OAuth tokens (32 bytes base64,
  # `openssl rand -base64 32`). Empty = the admin "Set email service account" flow is disabled.
  emailTokenEncKey: ""
  # §40 AI integration: encrypts the AI provider token (32 bytes base64, `openssl rand -base64 32`).
  # Empty = the Administration "AI integration" card is disabled.
  aiTokenEncKey: ""
  # §23 Show install URL: encrypts the recoverable copy of each install token (32 bytes base64,
  # `openssl rand -base64 32`). Empty = installs mint as before and can't be re-shown later.
  installTokenEncKey: ""
  # Secret key of the object-store account web + worker use. §49.12: this MUST be a
  # bucket-scoped account (s3:* on the artifact bucket only), never an object-store root/admin
  # pair. With the bundled MinIO (minio.enabled=true) the chart's evaluation-grade wiring reuses
  # this value as the MinIO root password — acceptable for evaluation only; for production point
  # the app at a scoped account (see NOTES step 2) or use an external store (minio.enabled=false)
  # with minio.external.accessKey + this key belonging to that scoped account.
  s3SecretKey: "change-me-minio"

# ── Non-secret config ────────────────────────────────────────────────────────
config:
  entraTenantId: ""
  entraClientId: ""
  bootstrapAdminGroup: ""
  oneTimeTokenTtlSeconds: "300"
  pointerRefreshIntervalMs: "86400000"
  smtp:
    host: ""
    port: "587"
    user: ""
    from: "skilly@example.com"
  webhookUrl: ""

# ── AI integration (§40 / §49.11) ─────────────────────────────────────────────
ai:
  # The AI provider base URL an admin saves is refused when it resolves to a private / loopback /
  # link-local address (SSRF guard). A provider on a private network (e.g. a self-hosted Open
  # WebUI on 10.x) can instead be allowed by a platform admin with the "Allow private-network base
  # URLs" switch on the AI integration card (§40.16). true = render AI_ALLOW_PRIVATE_BASE_URL=1 on
  # web + worker, which allows every non-public address, loopback and link-local included — set it
  # ONLY when the provider must be reached there; leave false otherwise.
  allowPrivateBaseUrl: false

# ── Migrations ────────────────────────────────────────────────────────────────
# The migrate Job applies the SQL files from a ConfigMap. Create it once from the repo:
#   kubectl -n <ns> create configmap skilly-migrations --from-file=db/migrations
migrations:
  existingConfigMap: "skilly-migrations"

# ── Bundled stateful dependencies (disable to use managed services) ───────────
# Images are pinned by tag + digest (§49.12); bumps are reviewed changes — see deploy/IMAGES.md
# for the current pins and the bump procedure. Keep them in sync with deploy/docker-compose.yml.
postgres:
  enabled: true
  image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
  user: skilly          # owner role (migrations run as this; app connects as skilly_app)
  database: skilly
  storage:
    size: 10Gi
    storageClass: ""
  external:
    host: ""           # used when enabled=false
    port: 5432

minio:
  enabled: true
  image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
  # Root user of the bundled MinIO. The app's S3 credentials should be a bucket-scoped account,
  # not this root pair (§49.12) — see secrets.s3SecretKey and NOTES step 2.
  rootUser: skilly
  bucket: skilly-artifacts
  storage:
    size: 20Gi
    storageClass: ""
  external:
    endpoint: ""       # used when enabled=false (e.g. https://s3.amazonaws.com)
    accessKey: ""      # a BUCKET-SCOPED account's access key (its secret = secrets.s3SecretKey)
    bucket: ""

clamav:
  enabled: true
  image: clamav/clamav:1.5.4@sha256:638d90201ee7ee6a82d249a2fc23b132e578673b5f1f2766852b127676ca1ef6
  # clamd port; web + worker get CLAMAV_HOST/CLAMAV_PORT only when enabled (§49.2/§49.12).
  port: "3310"
